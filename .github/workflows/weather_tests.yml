name: Weather Tool Tests

on:
  push:
    paths:
      - "week3/project/weather_tool/**"
      - ".github/workflows/weather_tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week3/project/weather_tool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -q
